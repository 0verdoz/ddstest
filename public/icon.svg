<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Roadway trapezoid -->
  <polygon points="176,140 336,140 400,430 112,430" fill="url(#roadGrad)" stroke="#475569" stroke-width="4" />

  <!-- Road Dashed Center line -->
  <line x1="256" y1="155" x2="256" y2="200" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="230" x2="256" y2="290" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="325" x2="256" y2="405" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />

  <!-- Georgia Peach / Shield Motif badge -->
  <g transform="translate(186, 75)">
    <path d="M70,10 C100,-15 150,15 130,55 C120,75 70,110 70,110 C70,110 20,75 10,55 C-10,15 40,-15 70,10 Z" fill="url(#shieldGrad)" />
    <!-- Leaf -->
    <path d="M70,10 C80,-10 100,-15 105,-12 C105,-12 95,0 75,5 Z" fill="#10b981" />
    <!-- "5" badge text -->
    <text x="70" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">5</text>
  </g>

  <!-- Official DDS Star Badge -->
  <circle cx="256" cy="450" r="18" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
  <polygon points="256,437 259,446 268,446 261,452 264,460 256,455 248,460 251,452 244,446 253,446" fill="#ffffff" />
</svg>
